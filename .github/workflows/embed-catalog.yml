name: Embed Loupe catalog

on:
  # RUNS WHEN THE CATALOG CHANGES, NOT AT A TIME OF DAY (2026-09-05).
  #
  # Added 2026-07-29 on a 02:00 cron because this workflow was dispatch-ONLY and
  # nobody ran it: embeddings.json went 29 days stale and 3,907 of 8,314 live
  # products (47%) had no vector at all, silently degrading "More like this",
  # "Similar to your saves" and the visual boost in the Discover deck for half
  # the catalog. The cron fixed the staleness and introduced a smaller version of
  # the same fault: 02:00 lands SIX HOURS BEFORE the 08:00 catalog rebuild, so
  # every night this embedded YESTERDAY's catalog. Anything published today had no
  # vector until tomorrow morning — a permanent one-day lag for exactly the newest
  # pieces, which are the ones the deck leads with.
  #
  # embed_catalog.py is a FULL rebuild keyed on today's catalog.json (that is what
  # makes orphaned vectors impossible), so the only correct time to run it is
  # immediately after catalog.json changes. workflow_run does that.
  #
  # It fires on EVERY successful refresh, not just the daily cron one — a
  # brands.json push or an approved brand also rebuilds the catalog, and those
  # runs are precisely the ones that add products. There is no wasted run to
  # avoid: refresh-catalog.yml FAILS if the build left catalog.json unchanged
  # (the archive heartbeat), so a success there always means new products.
  workflow_run:
    workflows: ["Refresh Loupe catalog"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

# Share ONE queue with every workflow that pushes to `main` (refresh-catalog,
# fx-refresh) so a long embed run (up to 3h) can't commit embeddings.json /
# catalog.meta.json concurrently with a catalog build and lose one side's write or
# publish a mismatched sha. cancel-in-progress: false lets an in-flight run finish
# first. Since 2026-09-05 this job STARTS as the catalog run ends, so it takes the
# queue immediately after that run releases it rather than racing it.
concurrency:
  group: loupe-main-writers
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    # A workflow_run fires on completion of ANY conclusion — failure, cancelled and
    # skipped included. Embedding a catalog whose build failed would rebuild the
    # index off a stale (or half-written) catalog.json and then commit it, which is
    # worse than not running: the lag this trigger exists to remove would come back
    # wearing a fresh timestamp.
    if: >-
      ${{ github.event_name == 'workflow_dispatch'
          || github.event.workflow_run.conclusion == 'success' }}
    steps:
      # EXPLICIT ref. On a workflow_run event the checked-out sha is not the
      # triggering run's head_sha (that is the commit the catalog build STARTED
      # from, i.e. yesterday's catalog) — taking the branch TIP is the whole point
      # of moving off the cron, so ask for it by name rather than relying on the
      # default resolution.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install open_clip_torch pillow numpy
      - name: Embed catalog
        working-directory: loupe-feed
        run: python embed_catalog.py
      - name: Refresh version stamp
        working-directory: loupe-feed
        run: python update_meta.py
      - name: Commit embeddings.json
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add loupe-feed/embeddings.json loupe-feed/catalog.meta.json
          if git diff --quiet --cached; then
            echo "No embedding changes."
            exit 0
          fi
          git commit -m "chore: refresh catalog image embeddings"
          # A long embed run can race the 08:00 catalog commit. Rebase onto the
          # latest main and VERIFY the remote actually advanced to OUR commit before
          # declaring success — the same hardening refresh-catalog.yml uses (a plain
          # push after a racing commit can "succeed" as an up-to-date no-op and
          # silently drop the embeddings). -X theirs: in a rebase 'theirs' is OUR
          # replayed commit, so generated files always take the newest build.
          branch="${GITHUB_REF_NAME:-main}"
          push_with_rebase() {
            git rebase --abort >/dev/null 2>&1 || true   # clear any half-done rebase
            git pull --rebase --autostash -X theirs origin "$branch" || return 1
            git push origin "HEAD:$branch" || return 1
            git fetch --quiet origin "$branch"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/$branch")" ]] || return 1
          }
          if push_with_rebase; then
            echo "Embeddings updated."
          else
            echo "Push failed or did not land — rebasing and retrying once."
            sleep 3
            if push_with_rebase; then
              echo "Embeddings updated on retry."
            else
              echo "ERROR: embeddings push failed after retry." >&2
              exit 1
            fi
          fi
      - name: Purge jsDelivr cache
        continue-on-error: true
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/HOboGoblin45/loupe-feed@main/loupe-feed/embeddings.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/HOboGoblin45/loupe-feed@main/loupe-feed/catalog.meta.json" || true
