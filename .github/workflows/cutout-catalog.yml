name: Cutout Loupe catalog

# Generates alpha-matted transparent WebP cutouts for the Look Builder (rembg / U²-Net,
# CPU) and hosts them on the orphan `cutouts` branch (jsDelivr-served, like catalog.json
# and embeddings.json) so `main` stays lean. INCREMENTAL: each run cuts out up to `limit`
# NEW products and skips everything already in cutouts.json, so the backfill completes
# over several runs. Manual dispatch + a nightly pass that catches newly-added products.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Max NEW cutouts to generate this run"
        default: "800"
  schedule:
    - cron: "0 4 * * *"   # 04:00 UTC nightly — well clear of the 08:00 catalog build

permissions:
  contents: write

concurrency:
  group: cutout-catalog
  cancel-in-progress: false

jobs:
  cutout:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout main (has the script)
        uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # rembg downloads its ~176MB U²-Net ONNX model to ~/.u2net on first use.
      # Cache it so only the first ever run pays the download.
      - name: Cache U²-Net model
        uses: actions/cache@v4
        with:
          path: ~/.u2net
          key: u2net-model-v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install "rembg[cpu]" pillow numpy onnxruntime

      # The cutouts live on an orphan branch. Clone it if it exists; otherwise start
      # an empty orphan history. All cutout state (img/*.webp + cutouts.json) lives
      # only here, so main is never bloated.
      - name: Prepare cutouts branch
        run: |
          set -e
          if git ls-remote --exit-code --heads origin cutouts >/dev/null 2>&1; then
            git clone --branch cutouts --single-branch \
              "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" cutrepo
          else
            mkdir cutrepo && cd cutrepo
            git init -q
            git checkout -q --orphan cutouts
            git remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"
            printf "# Loupe cutouts\nAlpha-matted product cutouts for the Look Builder. Generated by cutout_catalog.py; served via jsDelivr @cutouts. Do not edit by hand.\n" > README.md
            cd ..
          fi

      - name: Generate cutouts
        id: cut
        run: python loupe-feed/cutout_catalog.py --dir cutrepo --limit ${{ github.event.inputs.limit || '800' }}

      - name: Commit & push cutouts branch
        run: |
          set -e
          cd cutrepo
          git config user.name  "loupe-cutout-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --quiet --cached; then
            echo "No new cutouts."
            exit 0
          fi
          git commit -m "cutouts: batch $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin cutouts

      - name: Purge jsDelivr (manifest only; image paths are unique so never stale)
        continue-on-error: true
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/HOboGoblin45/loupe-feed@cutouts/cutouts.json" || true

      - name: Backfill progress
        run: |
          echo "Remaining to cut out: ${{ steps.cut.outputs.remaining || 'n/a' }}"
