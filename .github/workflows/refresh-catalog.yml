name: Refresh Loupe catalog

# Rebuilds loupe-feed/catalog.json from the brands' live Shopify feeds.
# Runs daily, on demand, and immediately whenever Aniqa approves a brand.
# The committed catalog.json is served — for free, globally cached — by jsDelivr:
#   https://cdn.jsdelivr.net/gh/<your-username>/<your-repo>@main/loupe-feed/catalog.json
#
# Brand requests are NEVER auto-added. Pipeline order each run:
#   1. Process brand requests (TWO stages):
#        STAGE A "review" — resolve + safety-gate every pending request; valid
#          ones are set to awaiting_review and EMAILED to Aniqa with one-click
#          Approve/Deny buttons (Resend). Junk is auto-rejected (no email).
#        STAGE B "add"    — append the brands Aniqa already APPROVED to
#          brands.json, mark them 'added', and record them in new_brands.json.
#   2. Build catalog — scrape every brand (incl. just-added ones), monetize via
#      Sovrn, write catalog.json.
#   3. Commit brands.json + catalog.json (default GITHUB_TOKEN; bot commits do
#      not retrigger this workflow, so there's no loop).
#   4. Notify the requester + that brand's followers via Expo push.

on:
  schedule:
    - cron: "0 8 * * *"   # every day at 08:00 UTC
  workflow_dispatch:       # manual "Run workflow" button
    inputs:
      override_heartbeat:
        description: "Publish even if the archive heartbeat says this build produced nothing new"
        type: boolean
        default: false
  push:
    # Rebuild immediately when ANY build INPUT changes — not just the brand list.
    # Before 2026-07-29 this listed brands.json only, so a fix to build_catalog.py
    # (a currency correction, a junk-filter tightening, a category rule) sat dark
    # for up to 24h until the next 08:00 cron: the code was on main but the live
    # catalog.json still carried the bug. Every file below is read by the build,
    # so a change to any of them should publish a corrected catalog at once.
    paths:
      - "loupe-feed/brands.json"        # brand list, per-brand currency, retailers
      - "loupe-feed/build_catalog.py"   # the build itself (filters, FX, categories)
      - "loupe-feed/curated.json"       # hand-built products merged into the feed
      - "loupe-feed/ranker_config.json" # embedded into catalog.ranker
      - "loupe-feed/update_meta.py"     # writes catalog.meta.json (version probe)
  repository_dispatch:
    types: [brand-approved]        # the Edge Function fires this on Approve →
                                   # run the pipeline immediately (Stage B adds it)

permissions:
  contents: write

# Serialize every trigger (daily cron, manual, brands.json push, and the
# brand-approved repository_dispatch) into ONE queue so a daily rebuild and an
# Approve-fired rebuild can't run concurrently and race on the commit/push —
# which could drop a just-added brand. cancel-in-progress: false means an
# in-flight run finishes (rather than being killed mid-commit) before the next
# queued run starts.
#
# The group name (`loupe-main-writers`) is SHARED with embed-catalog.yml: both
# workflows commit+push to `main` (catalog.json / embeddings.json / catalog.meta.json),
# so they must never run concurrently and race the rebase/verify push.
concurrency:
  group: loupe-main-writers
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # FULL history, not the depth-1 default. The commit history of
          # catalog.json IS the price/availability archive -- the one asset here
          # that cannot be re-acquired at any price -- and two things in this run
          # read it: archive_integrity.py (which writes ARCHIVE_STATUS.md below)
          # and test_archive_integrity.py. On a shallow checkout both would see a
          # single day and either refuse (they do, by design) or, if that guard
          # were ever removed, certify an archive a fraction of its real length.
          # Measured 2026-08-01: the whole repo bundles to 22.6 MB, because
          # minified single-line JSON delta-compresses almost perfectly. Full
          # history costs seconds here.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Process brand requests
        # The brand-approval pipeline (Supabase/Resend/Edge Function) is optional
        # and may not be configured yet. It must NEVER block the catalog rebuild —
        # if its secrets are missing or it errors, we log and carry on to the build.
        continue-on-error: true
        run: python loupe-feed/process_requests.py
        env:
          # Supabase (read pending/approved rows, write status transitions)
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          # Email Aniqa the Approve/Deny review (Stage A)
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ANIQA_EMAIL: ${{ secrets.ANIQA_EMAIL }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          # Build the signed Approve/Deny links into the Edge Function
          APPROVAL_BASE_URL: ${{ secrets.APPROVAL_BASE_URL }}
          APPROVAL_HMAC_SECRET: ${{ secrets.APPROVAL_HMAC_SECRET }}

      - name: Regression fixtures (junk filter + affiliate wrapper)
        # These gate the build, which cuts both ways: on 2026-07-24 commit 0732108
        # changed is_junk() without updating test_junk_filter.py, this step went
        # red every morning, and four days of the archive were lost before anyone
        # noticed. The gate was right and the blast radius was the problem, so the
        # answer is not a weaker gate -- it is archive-watchdog.yml, which now
        # notices within ~15h instead of never. Keep both.
        #
        # ALWAYS run these locally before pushing anything they cover.
        working-directory: loupe-feed
        run: |
          python test_junk_filter.py
          python test_affiliate_wrappers.py
          python test_color_category.py
          python test_accessory_subtype.py
          python test_price_history.py
          python test_archive_integrity.py

      - name: Build catalog
        run: python loupe-feed/build_catalog.py
        env:
          # SOVRN UNWRAPPED (2026-07-23, Charlie-approved): the Sovrn/viglink
          # account was DENIED, so wrapped links earned $0 while routing every
          # click through a dead redirect — and post-Phia-scandal, indie fashion
          # is hyper-alert to affiliate games. Omitting SOVRN_API_KEY makes
          # build_catalog emit CLEAN DIRECT links (monetize() falls through).
          # To re-enable if Sovrn ever approves useloupe.shop: restore
          #   SOVRN_API_KEY: ${{ secrets.SOVRN_API_KEY }}
          #   SOVRN_CUID: ${{ secrets.SOVRN_CUID }}
          # Per-brand affiliate deep-link templates (JSON: brand -> template with
          # a {url} token). Still active — takes precedence per brand. Add via repo
          # Settings -> Secrets as direct-program approvals land (Rakuten/Awin/...).
          BRAND_AFFILIATE_TEMPLATES: ${{ secrets.BRAND_AFFILIATE_TEMPLATES }}

      - name: Archive heartbeat (did this build actually produce anything?)
        # The July gap was the LOUD failure. This guards the quiet one on the
        # other side of it: a run that goes green having published yesterday's
        # data again. Nothing caught that shape before, because `generatedAt` is a
        # wall clock -- it moves on every run, so a completely stale scrape still
        # produces a changed file and a perfectly normal-looking commit. The
        # archive would keep gaining days that carry no new observation, which is
        # worse than a gap: a gap is visible, a fake day is not.
        #
        # Checks, against the COMMITTED catalog rather than the on-disk one, so it
        # also catches "the build wrote nothing at all":
        #   * byte-identical                       -> build_catalog.py did not write
        #   * identical once generatedAt is removed -> the scrape returned nothing new
        #     (never happened once across all 42 archived days -- FX alone moves
        #     prices daily -- so this has a measured zero false-positive rate)
        #   * count moved more than -20% / +25%     -> implausible. The -20% side
        #     backstops build_catalog.py's own PUBLISH GUARD; the +25% side is not
        #     checked anywhere else, and inflation is the failure that looks like
        #     success.
        #
        # ARCHIVE_HEARTBEAT_OVERRIDE can only ever be set from a manual run. Cron
        # has no way to reach it, which is the point: the automated path cannot
        # talk itself out of the check.
        env:
          ARCHIVE_HEARTBEAT_OVERRIDE: ${{ inputs.override_heartbeat && '1' || '' }}
        run: python loupe-feed/archive_integrity.py --heartbeat

      - name: Commit if changed
        run: |
          set -euo pipefail
          git config user.name  "loupe-catalog-bot"
          git config user.email "actions@users.noreply.github.com"
          # process_requests.py (Stage B) can edit brands.json; build_catalog.py
          # writes catalog.json. Commit both. new_brands.json is intentionally
          # NOT committed (it's gitignored, run-local handoff to the notify step).
          # This used to `exit 0` with "No catalog changes." That is the exact
          # shape of a run that publishes nothing and still reports success, and
          # it is unreachable now anyway (the heartbeat above fails first), so it
          # fails instead. A green run must mean a day was added to the archive.
          if [[ -z "$(git status --porcelain loupe-feed/brands.json loupe-feed/catalog.json loupe-feed/catalog.meta.json)" ]]; then
            echo "ERROR: the build left the catalog unchanged, so this run would add" >&2
            echo "no day to the archive. Failing rather than reporting success." >&2
            exit 1
          fi
          git add loupe-feed/brands.json loupe-feed/catalog.json loupe-feed/catalog.meta.json
          git commit -m "chore: refresh catalog $(date -u +%Y-%m-%d)"

          # Regenerate the integrity record NOW, with today's snapshot already in
          # `git log`, and fold it into the same commit. --amend is purely local
          # (nothing has been pushed yet) and keeps the archive at one commit per
          # day. The record deliberately describes COMMITTED history only: a
          # status file that counted a day still sitting in the working tree
          # would be the same class of quiet overstatement as a shallow clone
          # reporting its own start date as the start of the data.
          #
          # FAIL-SOFT, and this matters more than it looks. This block sits under
          # `set -e` BETWEEN the commit and the push, so anything here that exits
          # non-zero would abort the step with the day committed locally and never
          # pushed -- losing exactly the day it exists to account for. The archive
          # comes first; the record about the archive comes second. It is allowed
          # to be a day stale. It is not allowed to cost a day.
          if python loupe-feed/archive_integrity.py --quiet --write; then
            git add ARCHIVE_STATUS.md loupe-feed/archive_status.json
            git commit --amend --no-edit
          else
            echo "WARNING: could not regenerate the integrity record. Publishing the" >&2
            echo "catalog anyway -- the snapshot matters more than the paperwork." >&2
          fi
          # Put the headline on the run page too, so the state of the archive is
          # the first thing visible on a run rather than something you have to go
          # and look for. Not looking is how July happened.
          {
            echo '## Archive'
            echo '```'
            python loupe-feed/archive_integrity.py --headline || echo "(unavailable)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # Even though concurrency serializes our own runs, a human commit (or a
          # brands.json push) can land between checkout and push. Rebase onto the
          # latest main and retry once on a non-fast-forward so an approved brand's
          # commit is never lost to a rejected push.
          #
          # 2026-07-15 hardening (the run-63 silent drop): when ANOTHER bot commit
          # rewrote catalog.json between our checkout and push, the plain
          # `pull --rebase` hit a content conflict, left HEAD parked on the new
          # base, and `git push HEAD` then "succeeded" as an up-to-date NO-OP —
          # the freshly built catalog was silently discarded while every step
          # stayed green. Two fixes:
          #   • `-X theirs`: in a REBASE, 'theirs' = the commit being replayed —
          #     i.e. OUR just-generated catalog. Generated files should always
          #     take the newest build, so auto-resolve conflicts in our favor.
          #   • verify the push actually advanced the remote to OUR commit; a
          #     no-op push now fails loudly instead of masquerading as success.
          branch="${GITHUB_REF_NAME:-main}"
          push_with_rebase() {
            git rebase --abort >/dev/null 2>&1 || true   # clear any half-done rebase from a failed try
            git pull --rebase --autostash -X theirs origin "$branch" || return 1
            git push origin "HEAD:$branch" || return 1
            # Confirm OUR catalog commit is what the remote now points at.
            git fetch --quiet origin "$branch"
            [[ "$(git rev-parse HEAD)" == "$(git rev-parse "origin/$branch")" ]] || return 1
          }
          if push_with_rebase; then
            echo "Catalog updated."
          else
            echo "Push failed or did not land — rebasing and retrying once."
            sleep 3
            if push_with_rebase; then
              echo "Catalog updated on retry."
            else
              echo "ERROR: catalog push failed after retry." >&2
              exit 1
            fi
          fi

      - name: Notify requesters & followers
        # Push notifications are best-effort and optional — never fail the run.
        continue-on-error: true
        run: python loupe-feed/notify_brand_requests.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Purge jsDelivr cache
        # The committed catalog is served via cdn.jsdelivr.net, which caches
        # aggressively; without a purge, devices keep the old feed for hours.
        # Best-effort - never fail the run over a CDN hiccup.
        continue-on-error: true
        run: |
          curl -fsS "https://purge.jsdelivr.net/gh/HOboGoblin45/loupe-feed@main/loupe-feed/catalog.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/HOboGoblin45/loupe-feed@main/loupe-feed/embeddings.json" || true
          curl -fsS "https://purge.jsdelivr.net/gh/HOboGoblin45/loupe-feed@main/loupe-feed/catalog.meta.json" || true
